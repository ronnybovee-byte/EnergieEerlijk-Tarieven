
name: Controle gastariefkaarten

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * 1"

permissions:
  contents: read

jobs:
  controle-gas:
    runs-on: ubuntu-latest

    steps:
      - name: Repository ophalen
        uses: actions/checkout@v4

      - name: Python instellen
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Benodigde pakketten installeren
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests pdfplumber

      - name: Gastariefkaarten controleren
        run: python controle_gas_tariefkaarten.py
