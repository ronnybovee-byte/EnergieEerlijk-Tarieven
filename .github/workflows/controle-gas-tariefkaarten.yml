
name: Controle gastariefkaarten

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * 1"

permissions:
  contents: write

concurrency:
  group: gas-tariefkaarten-publicatie
  cancel-in-progress: false

jobs:
  controle-gas:
    runs-on: ubuntu-latest

    steps:
      - name: Repository ophalen
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Python instellen
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Benodigde pakketten installeren
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-nld
          python -m pip install --upgrade pip
          python -m pip install requests pdfplumber pymupdf pytesseract pillow beautifulsoup4

      - name: Gastariefkaarten controleren
        run: python controle_gas_tariefkaarten.py
        
      - name: Geldigheidsmaand gastariefkaarten onderzoeken
        run: python controle_gas_geldigheidsmaand.py
        
      - name: Nieuwe gastariefkaarten zoeken
        run: python zoek_nieuwe_gaskaarten.py
        
      - name: Gevonden gasarchiefkaarten controleren
        run: python controle_gas_archiefkandidaten.py
        
      - name: Gasprijsformules uit archief vergelijken
        run: python controle_gas_archiefformules.py
        
      - name: Vaste gasvergoedingen onderzoeken
        run: python controle_gas_vaste_vergoeding.py
        
      - name: Vaste gasvergoedingen valideren
        run: python valideer_gas_vaste_vergoedingen.py
        
      - name: Gasindexwaarden uit tariefkaarten controleren
        run: python controle_gas_indexwaarden.py
        
      - name: Gasindexwaarden normaliseren
        run: python normaliseer_gas_indexwaarden.py
        
      - name: Actuele gasindexen bij leveranciers ophalen
        run: python haal_gasindexen_op.py
        
      - name: ENGIE historische gasindex ophalen
        run: python haal_engie_gasindex_op.py
        
      - name: Luminus gasindex en forward ophalen
        run: python haal_luminus_gasindex_op.py
        
      - name: Gasindexen van drie leveranciers combineren
        run: python combineer_gas_indexen.py
        
      - name: ENGIE en Luminus indexbronnen onderzoeken
        run: python onderzoek_engie_luminus_gasindexen.py

      - name: Gasgeldigheid toevoegen aan JSON
        run: python verrijk_gas_geldigheid.py
        
      - name: Gasprijzen controleren voor veilige publicatie
        run: python controle_gas_publicatie.py

      - name: JSON-uitvoer valideren
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          bestand = Path("gas_gevalideerde_formules.json")
          if not bestand.is_file():
              raise SystemExit("FOUT: gas-JSON ontbreekt")

          data = json.loads(bestand.read_text(encoding="utf-8"))

          if data.get("schema_version") != 1:
              raise SystemExit("FOUT: onbekende JSON-versie")

          contracten = data.get("contracten")
          if not isinstance(contracten, dict) or not contracten:
              raise SystemExit("FOUT: geen gevalideerde contracten")

          for naam, formule in contracten.items():
              if not isinstance(formule, dict):
                  raise SystemExit(f"FOUT: ongeldige formule voor {naam}")
              if not isinstance(formule.get("index"), str) or not formule["index"]:
                  raise SystemExit(f"FOUT: index ontbreekt voor {naam}")
              for veld in ("factor", "toeslag"):
                  waarde = formule.get(veld)
                  if type(waarde) not in (int, float):
                      raise SystemExit(f"FOUT: {veld} ongeldig voor {naam}")

          print(f"JSON geldig: {len(contracten)} gevalideerde formules")
          PY

      - name: Gevalideerde gasformules publiceren
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"     
                       
           git add gas_gevalideerde_formules.json gas_bronregister.json gas_gevonden_tariefkaarten.json gas_archiefformules_vergelijking.json gas_app_publicatie_status.json gas_vaste_vergoeding_kandidaten.json gas_vaste_vergoedingen_validatie.json gas_indexwaarden_bewijs.json gas_indexwaarden_genormaliseerd.json gas_indexen_leveranciers.json gas_index_brononderzoek.json gas_luminus_index.json gas_indexen_gecombineerd.json

          if git diff --cached --quiet; then
            echo "Geen wijzigingen om te publiceren"
          else
            git commit -m "Update gevalideerde gasformules"
            git push origin HEAD:main
          fi
