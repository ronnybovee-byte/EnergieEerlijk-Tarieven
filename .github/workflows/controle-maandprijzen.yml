
name: Controle maandprijzen (test)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  controle:
    runs-on: ubuntu-latest

    steps:
      - name: Haal repositorybestanden op
        uses: actions/checkout@v5

      - name: Installeer PDF-uitlezer
        run: python3 -m pip install pdfplumber

      - name: Controleer prijzen van alle 14 contracten
        run: python3 controle_alle_prijzen.py
