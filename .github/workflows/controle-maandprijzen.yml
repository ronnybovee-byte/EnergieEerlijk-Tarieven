
name: Controle maandprijzen (test)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  controle:
    runs-on: ubuntu-latest

    steps:
      - name: Haal repositorybestanden op
        uses: actions/checkout@v5

      - name: Installeer PDF-uitlezer
        run: python3 -m pip install pdfplumber

      - name: Controleer CSV en alle contracten
        run: |
          python3 - <<'PY'
          import csv

          with open("tariefkaart_scenarios_v120.csv",
                    newline="", encoding="utf-8-sig") as bestand:
              producten = list(csv.DictReader(bestand))

          print(f"Aantal contracten: {len(producten)}")

          if len(producten) != 14:
              raise RuntimeError("Onverwacht aantal contracten")

          for product in producten:
              print(product["id"], product["contract"])

          print("GESLAAGD: 14 contracten gevonden")
          PY

      - name: Controleer vier prijzen OCTA+ Basic Online
        run: |
          python3 - <<'PY'
          import urllib.parse
          import urllib.request

          url = (
              "https://www.vtest.be/Profile/DownloadTariffCard?"
              + urllib.parse.urlencode({
                  "productId": "18582",
                  "signUpDate": "1/11/2026 00:00:00",
              })
          )

          request = urllib.request.Request(
              url, headers={"User-Agent": "Mozilla/5.0"}
          )

          with urllib.request.urlopen(request, timeout=30) as response:
              inhoud = response.read(10_000_000)

          if not inhoud.startswith(b"%PDF-"):
              raise RuntimeError("Ongeldige PDF")

          with open("octa_basic_online.pdf", "wb") as bestand:
              bestand.write(inhoud)
          PY

          python3 lees_tariefkaart.py \
            octa_basic_online.pdf tariefkaart_scenarios_v120.csv
