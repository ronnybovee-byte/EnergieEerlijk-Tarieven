
name: Test ENGIE Basic Online

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-engie:
    runs-on: ubuntu-latest

    steps:
      - name: Haal repositorybestanden op
        uses: actions/checkout@v5

      - name: Installeer PDF-uitlezer
        run: python3 -m pip install pdfplumber

     
      - name: Controleer ENGIE-prijzen
        run: |
          python3 - <<'PY'
          from decimal import Decimal
          from lees_tariefkaart import lees_engie_basic_online

          contracten = [
              (
                  "Basic Online",
                  "DownloadTariffCard (5).pdf",
                  ["25.198", "19.708", "20.00", "1.582"]
              ),
              (
                  "Direct Online",
                  "DownloadTariffCard (6).pdf",
                  ["25.684", "20.303", "30.00", "1.582"]
              ),
              (
                  "Flow",
                  "DownloadTariffCard (7).pdf",
                  ["25.851", "20.283", "59.00", "1.582"]
              ),
              (
                  "Easy",
                  "DownloadTariffCard (8).pdf",
                  ["26.186", "20.932", "65.00", "1.582"]
              ),
          ]


          velden = [
              "dag_ct",
              "nacht_ct",
              "vast_eur",
              "groen_wkk_ct",
          ]

          for naam, pdf, verwacht in contracten:
              print(f"\nControle: ENGIE {naam}")
              prijzen = lees_engie_basic_online(pdf)

              for veld, waarde in zip(velden, verwacht):
                  gevonden = Decimal(str(prijzen[veld]))
                  if gevonden != Decimal(waarde):
                      raise AssertionError(
                          f"FOUT {veld}: PDF={gevonden}, CSV={waarde}"
                      )
                  print(f"{veld}: PDF={gevonden} CSV={waarde} OK")

          print("\nGESLAAGD: alle vier de ENGIE-contracten kloppen")
          PY

