
name: Test Energy Knights Essentia Online

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  controle:
    runs-on: ubuntu-latest

    steps:
      - name: Repository ophalen
        uses: actions/checkout@v4

      - name: PDF-uitlezer installeren
        run: python3 -m pip install pdfplumber

      - name: Controleer Energy Knights 17211
        run: |
          python3 - <<'PY'
          import csv
          import io
          import urllib.parse
          import urllib.request
          import pdfplumber

          product_id = "17211"

          with open("tariefkaart_scenarios_v120.csv",
                    encoding="utf-8-sig", newline="") as f:
              regels = list(csv.DictReader(f))

          matches = [
              r for r in regels
              if r["id"].strip() == product_id
          ]
          if len(matches) != 1:
              raise RuntimeError("Product 17211 niet uniek in CSV")

          print("CSV-record:", matches[0])

          basis = "https://www.vtest.be/Profile/DownloadTariffCard"
          url = basis + "?" + urllib.parse.urlencode({
              "productId": product_id,
              "signUpDate": "1/11/2026 00:00:00",
          })

          request = urllib.request.Request(
              url, headers={"User-Agent": "Mozilla/5.0"}
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              pdf = response.read(10_000_000)

          if not pdf.startswith(b"%PDF-"):
              raise RuntimeError("Geen geldige PDF")

          with pdfplumber.open(io.BytesIO(pdf)) as document:
              pagina1 = document.pages[0].extract_text() or ""
              pagina2 = document.pages[1].extract_text() or ""

          def controleer(omschrijving, waarde, tekst):
              if waarde not in tekst:
                  raise AssertionError(
                      f"{omschrijving}: {waarde} ontbreekt"
                  )
              print("OK:", omschrijving, waarde)

          controleer("Dagprijs", "20,79", pagina1)
          controleer("Nachtprijs", "19,88", pagina1)
          controleer("Vaste vergoeding", "10,00", pagina1)
          controleer("Groene stroom", "1,16", pagina2)
          controleer("WKK", "0,36", pagina2)

          print("Energy Knights 17211: PDF-waarden gevonden")
          PY
