
name: Controle tariefkaarten

on:
  schedule:
    - cron: '15 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  controle:
    runs-on: ubuntu-latest

    steps:
      - name: Controleer officiële tariefkaarten
        run: |
          python3 - <<'PY'
          import urllib.request
          from datetime import datetime, timezone

          basis = "https://www.vtest.be/Profile/DownloadTariffCard"
          datum = "1/11/2026 00:00:00"

          producten = {
              18582: "OCTA+ Basic Online",
              18399: "OCTA+ Boost Flex",
          }

          for product_id, naam in producten.items():
              from urllib.parse import urlencode

              url = basis + "?" + urlencode({
                  "productId": product_id,
                  "signUpDate": datum,
              })

              request = urllib.request.Request(
                  url,
                  headers={"User-Agent": "Mozilla/5.0"}
              )

              with urllib.request.urlopen(request, timeout=30) as response:
                  inhoud = response.read(10_000_000)

              if not inhoud.startswith(b"%PDF-"):
                  raise RuntimeError(
                      f"Geen geldige PDF voor {naam} ({product_id})"
                  )

              print(f"OK: {naam} ({product_id})")

          print("Controle voltooid:",
                datetime.now(timezone.utc).isoformat())
          PY
