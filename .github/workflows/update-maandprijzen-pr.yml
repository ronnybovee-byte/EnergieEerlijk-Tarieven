name: Maandprijzen automatisch bijwerken

on:
  workflow_dispatch:
  schedule:
    - cron: '30 7 6 * *'

permissions:
  contents: write

concurrency:
  group: elektriciteit-tarieven-publicatie
  cancel-in-progress: false

jobs:
  update-maandprijzen:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Repository ophalen
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Python installeren
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Bibliotheken installeren
        run: python3 -m pip install pdfplumber

      - name: Nieuwe maandprijzen ophalen
        run: python3 update_maandprijzen.py

      - name: Volledige eindcontrole
        run: python3 controle_alle_prijzen.py

      - name: Gevalideerde elektriciteitsprijzen publiceren
        run: |
          if git diff --quiet -- tariefkaart_scenarios_v120.csv; then
            echo "Geen wijzigingen om te publiceren"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add tariefkaart_scenarios_v120.csv
          git commit -m "Automatische update gevalideerde elektriciteitsprijzen"
          git push origin HEAD:main
